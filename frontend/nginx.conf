server {
    listen 80;

    # The frontend is deployed as a standalone Dokploy Application.
    # The Angular app calls the backend's public domain directly (configured
    # in environment.ts), so this nginx only serves static files + SPA fallback.
    # CORS on the backend handles the cross-origin requests.

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
