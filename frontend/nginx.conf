server {
    listen 80;

    # Defer upstream DNS resolution to request time so Nginx does not fail at
    # startup when the "backend" host is absent. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy /api to the backend container over the Docker network.
    # This works both locally (docker-compose) and on Dokploy (dokploy-network).
    location /api {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve the Angular SPA with client-side route fallback.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
