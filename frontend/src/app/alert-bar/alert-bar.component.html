<div
  class="relative z-50 flex h-9 items-center justify-between gap-4 border-b border-red-800/40 bg-red-800/20 px-6 text-xs font-medium md:px-10"
  role="status"
  aria-live="polite"
>
  <div class="flex items-center gap-2.5 text-red-400">
    <span class="relative flex h-2 w-2">
      <span class="animate-pulse-dot absolute inline-flex h-full w-full rounded-full bg-red-400"></span>
    </span>
    <span class="font-semibold uppercase tracking-[0.2em]">Active Response</span>
  </div>

  <div class="hidden flex-1 truncate text-center text-gray-200 sm:block">
    {{ current() }}
  </div>

  <div class="flex items-center gap-2 text-gray-300">
    <i class="pi pi-clock text-red-400"></i>
    <span class="font-semibold uppercase tracking-wider">24/7 Operations</span>
  </div>
</div>
