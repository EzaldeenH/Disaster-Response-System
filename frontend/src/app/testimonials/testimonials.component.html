<section class="border-t border-border bg-bg px-6 py-24 md:px-10 md:py-32">
  <div class="mx-auto max-w-6xl">
    <div class="mb-16 max-w-2xl">
      <span class="mb-4 block text-xs font-semibold uppercase tracking-[0.25em] text-highlight">
        Voices from the Field
      </span>
      <h2 class="font-display text-4xl font-bold text-text sm:text-5xl">Stories of Hope</h2>
    </div>

    <div class="grid grid-cols-1 gap-8 md:grid-cols-3">
      @for (t of testimonials; track t.name) {
        <figure class="flex flex-col gap-6 rounded-lg border border-border bg-surface p-8 transition-colors hover:border-danger/40">
          <i class="pi pi-quote-right text-3xl text-danger/60"></i>
          <blockquote class="flex-1 text-base leading-relaxed text-text-muted">
            "{{ t.quote }}"
          </blockquote>
          <figcaption class="border-t border-border pt-4">
            <div class="font-display font-semibold text-text">{{ t.name }}</div>
            <div class="text-sm text-danger">{{ t.role }}</div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
