<p-dialog
  [(visible)]="visible"
  header="Donation Amount"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-md "
  [breakpoints]="{ '640px': '95vw' }"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 ">
    <div class="flex flex-col gap-1.5">
      <label for="amount" class="text-sm font-semibold text-text">Amount (USD)</label>
      <p-inputNumber
        inputId="amount"
        formControlName="amount"
        mode="currency"
        currency="USD"
        locale="en-US"
        [min]="1"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        placeholder="0.00"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
      @if (form.controls.amount.invalid && form.controls.amount.touched) {
        <p-message severity="error" size="small" text="Please enter a valid amount (min $1)." />
      }
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <p-button label="Cancel" severity="secondary" [outlined]="true" type="button" (onClick)="onCancel()" />
      <p-button label="Donate" icon="pi pi-heart" type="submit" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
