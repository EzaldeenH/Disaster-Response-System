<p-dialog
  [(visible)]="visible"
  header="Donor Registration"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-md "
  [breakpoints]="{ '640px': '95vw' }"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 ">
    <div class="flex flex-col gap-1.5">
      <label for="name" class="text-sm font-semibold text-text">Name</label>
      <input pInputText id="name" formControlName="name" placeholder="Your full name" class="w-full" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <p-message severity="error" size="small" text="Name is required." />
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="organization" class="text-sm font-semibold text-text">
        Organization <span class="font-normal text-text-subtle">(optional)</span>
      </label>
      <input pInputText id="organization" formControlName="organization" placeholder="Organization you represent" class="w-full" />
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <p-button label="Cancel" severity="secondary" [outlined]="true" type="button" (onClick)="onCancel()" />
      <p-button label="Continue" icon="pi pi-arrow-right" type="submit" [disabled]="form.invalid" />
    </div>
  </form>
</p-dialog>
