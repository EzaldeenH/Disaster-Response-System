<section class="border-y border-white/10 bg-ink-soft py-20 md:py-28">
  <div class="mx-auto max-w-6xl px-6 md:px-10">
    <div class="mb-16 text-center">
      <span class="mb-4 block text-xs font-semibold uppercase tracking-[0.25em] text-highlight">
        Our Impact
      </span>
      <h2 class="font-display text-3xl font-bold text-text sm:text-4xl">
        Real Numbers, Real Lives
      </h2>
    </div>

    <div #statsGrid class="grid grid-cols-2 gap-px overflow-hidden rounded-lg bg-white/10 lg:grid-cols-4">
      @for (stat of stats; track stat.label; let i = $index) {
        <div class="flex flex-col items-center gap-3 bg-ink p-8 text-center md:p-10">
          <i [class]="stat.icon" class="text-3xl text-highlight"></i>
          <span
            class="font-display text-4xl font-extrabold md:text-5xl"
            [class.text-text]="!stat.live"
            [class.text-danger]="stat.live"
          >
            {{ format(stat, displayValues[i]()) }}
          </span>
          @if (stat.live) {
            <span class="flex items-center gap-1.5 text-sm font-medium uppercase tracking-wider text-danger">
              <span class="relative flex h-1.5 w-1.5">
                <span class="animate-pulse-dot absolute inline-flex h-full w-full rounded-full bg-danger"></span>
              </span>
              {{ stat.label }}
            </span>
          } @else {
            <span class="text-sm font-medium uppercase tracking-wider text-text-muted">{{ stat.label }}</span>
          }
        </div>
      }
    </div>
  </div>
</section>
