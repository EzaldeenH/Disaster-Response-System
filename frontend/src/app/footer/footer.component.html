<footer class="bg-ink px-6 pb-8 pt-24 text-gray-300 md:px-10">
  <div class="mx-auto max-w-6xl">
    <!-- Newsletter -->
    <div class="flex flex-col items-center gap-6 border-b border-white/10 pb-16 text-center">
      <h2 class="font-display text-3xl font-bold text-white sm:text-4xl">Stay Informed</h2>
      <p class="max-w-md text-sm text-gray-400">
        Subscribe to receive updates on our relief efforts and how your support
        is making an impact.
      </p>
      <form class="flex w-full max-w-md gap-2" (ngSubmit)="subscribeToNewsletter()">
        <input
          pInputText
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
          class="flex-1 !bg-white/5 !border-white/15 !text-white placeholder:!text-gray-500"
        />
        <p-button label="Subscribe" type="submit" icon="pi pi-envelope" />
      </form>
    </div>

    <!-- Brand + nav -->
    <div class="flex flex-col items-center justify-between gap-8 py-12 md:flex-row">
      <div class="flex items-center gap-3">
        <i class="pi pi-hand-holding-heart text-2xl text-highlight"></i>
        <span class="font-display text-xl font-bold text-white">Helping Hands</span>
      </div>
      <nav class="flex flex-wrap justify-center gap-8 text-sm">
        @for (link of footerLinks; track link.label) {
          <a [href]="link.href" class="text-gray-400 transition-colors hover:text-white">{{ link.label }}</a>
        }
      </nav>
    </div>

    <!-- Bottom bar -->
    <div class="flex flex-col items-center justify-between gap-6 border-t border-white/10 pt-8 text-sm md:flex-row">
      <p class="text-gray-500">© 2024 Helping Hands, Inc. • Privacy • Terms • Sitemap</p>
      <div class="flex gap-3">
        @for (social of socials; track social.label) {
          <a
            [href]="social.href"
            [attr.aria-label]="social.label"
            class="flex h-9 w-9 items-center justify-center rounded-full border border-white/15 text-gray-400 transition-colors hover:border-white hover:bg-white hover:text-ink"
          >
            <i [class]="social.icon"></i>
          </a>
        }
      </div>
    </div>
  </div>
</footer>
