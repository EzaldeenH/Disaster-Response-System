<section class="border-t border-border bg-surface px-6 py-24 md:px-10 md:py-32">
  <div class="mx-auto max-w-6xl">
    <div class="mb-16 max-w-2xl">
      <span class="mb-4 block text-xs font-semibold uppercase tracking-[0.25em] text-highlight">
        Get Involved
      </span>
      <h2 class="font-display text-4xl font-bold text-text sm:text-5xl">How You Can Help</h2>
      <p class="mt-4 text-lg text-text-muted">
        Every contribution — time, funds, or awareness — directly supports
        families rebuilding their lives. There are many ways to make a difference.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (card of cards; track card.title) {
        <div class="group flex min-h-[280px] flex-col gap-5 rounded-lg border border-border bg-surface-elevated p-8 transition-all hover:border-danger/40 hover:bg-surface-muted">
          <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/10 text-highlight transition-colors group-hover:bg-danger group-hover:text-white">
            <i [class]="card.icon" class="text-xl"></i>
          </div>
          <h3 class="font-display text-xl font-semibold text-text">{{ card.title }}</h3>
          <p class="flex-1 text-sm leading-relaxed text-text-muted">{{ card.description }}</p>
          <button class="flex items-center gap-2 self-start text-sm font-semibold text-white transition-colors hover:text-danger">
            {{ card.buttonText }}
            <i class="pi pi-arrow-right text-xs"></i>
          </button>
        </div>
      }
    </div>
  </div>
</section>
