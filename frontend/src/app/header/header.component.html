<header class="absolute top-9 left-0 z-40 flex h-20 w-full items-center justify-between px-6 md:px-10">
  <!-- Brand -->
  <div class="flex items-center gap-2.5 text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.8)]">
    <i class="pi pi-hand-holding-heart text-2xl text-highlight"></i>
    <span class="font-display text-xl font-bold tracking-tight">Helping Hands</span>
  </div>

  <!-- Primary nav -->
  <nav class="hidden flex-1 justify-center md:flex">
    <ul class="flex items-center gap-1">
      @for (item of navItems; track item.label) {
        <li>
          @if (item.action) {
            <button
              type="button"
              class="rounded-md px-4 py-2 text-sm font-semibold text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.8)] transition-colors hover:text-highlight"
              (click)="item.action()"
            >
              {{ item.label }}
            </button>
          } @else {
            <a
              href="#"
              class="block rounded-md px-4 py-2 text-sm font-semibold text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.8)] transition-colors hover:text-highlight"
              [class.text-highlight]="item.active"
            >
              {{ item.label }}
            </a>
          }
        </li>
      }
    </ul>
  </nav>

  <!-- CTAs -->
  <div class="flex items-center gap-3">
    <p-button label="Get Help" severity="secondary" [outlined]="true" size="small" styleClass="!border-white/40 !text-white hover:!bg-white/10" />
    <p-button label="Donate Now" size="small" (onClick)="onDonate()" styleClass="!bg-danger !border-danger !text-white hover:!bg-red-600" />
  </div>
</header>
