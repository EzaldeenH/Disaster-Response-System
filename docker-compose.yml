services:
  backend:
    build:
      context: ./backend
      dockerfile: Disaster Response System/Dockerfile
    expose:
      - "80"
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DisasterResponseSystemDBContext=Server=db;Database=DisasterResponseSystem;User Id=sa;Password=${DB_PWD};TrustServerCertificate=True
      - Cors__AllowedOrigins__0=${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - drs_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
    networks:
      - drs_net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PWD}
    volumes:
      - drs-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - drs_net

volumes:
  drs-db-data:

networks:
  drs_net:
    name: drs_net
