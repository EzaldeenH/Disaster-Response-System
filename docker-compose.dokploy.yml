# Docker Compose for Dokploy deployment.
# Uses dokploy-network (external) so Traefik can route traffic.
# Domains use nip.io free wildcard DNS (anything.158.158.72.65.nip.io → 158.158.72.65).
#
# Usage in Dokploy:
#   1. Create a Compose application, point at this file (docker-compose.dokploy.yml)
#   2. Set env vars in Dokploy: DB_PWD, CORS_ORIGIN
#   3. CORS_ORIGIN should be http://drs-frontend.158.158.72.65.nip.io
#   4. Deploy
#
# URLs after deploy:
#   Frontend:  http://drs-frontend.158.158.72.65.nip.io
#   Swagger:   http://drs-frontend.158.158.72.65.nip.io/swagger  (proxied via frontend nginx)
#   Backend:   http://drs-backend.158.158.72.65.nip.io           (direct, for debugging)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Disaster Response System/Dockerfile
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DisasterResponseSystemDBContext=Server=db;Database=DisasterResponseSystem;User Id=sa;Password=${DB_PWD};TrustServerCertificate=True
      - Cors__AllowedOrigins__0=${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drs-backend.rule=Host(`drs-backend.158.158.72.65.nip.io`)"
      - "traefik.http.routers.drs-backend.entrypoints=web"
      - "traefik.http.services.drs-backend.loadbalancer.server.port=80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drs-frontend.rule=Host(`drs-frontend.158.158.72.65.nip.io`)"
      - "traefik.http.routers.drs-frontend.entrypoints=web"
      - "traefik.http.services.drs-frontend.loadbalancer.server.port=80"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PWD}
    volumes:
      - drs-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - dokploy-network

volumes:
  drs-db-data:

networks:
  dokploy-network:
    external: true
